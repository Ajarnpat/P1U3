<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Conservation Explorer</title><style>:root{--g:#0b6b4f;--p:#e9f5f0;--d:#1e2a28;--l:#d6e2de}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:var(--d);line-height:1.5}header{background:#074d39;color:#fff;padding:28px 18px}.wrap,main{max-width:940px;margin:auto}main{padding:22px 16px}section{background:#fff;border:1px solid var(--l);border-radius:14px;padding:20px;margin-bottom:16px}.rule{background:#fff1c9;border-left:5px solid #d49a14;padding:10px 12px;border-radius:8px}.tabs button{border:0;padding:9px 12px;border-radius:8px;font-weight:700;margin-right:5px}.tabs .active{background:var(--g);color:#fff}.pane{display:none}.pane.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin-top:10px}input[type=range]{width:100%}.box{background:var(--p);padding:12px;border-radius:10px}.formula{font-family:Cambria,serif;font-size:20px;font-weight:700;text-align:center;padding:8px}.bars{display:flex;gap:18px;align-items:flex-end;height:220px;border:1px solid var(--l);border-radius:10px;padding:15px}.bw{flex:1;text-align:center}.bar{width:65%;margin:auto;background:var(--g);border-radius:6px 6px 0 0}.val{font-weight:700}</style></head><body><header><div class="wrap"><h1>Energy Conservation Explorer</h1><p>AP Physics 1 · Unit 3 · Lesson 2</p></div></header><main><section><div class="rule"><b>Working convention:</b> equation first → rearrange → substitute → answer.</div><div class="tabs"><button id="b1" class="active" onclick="tab(1)">Falling ball</button><button id="b2" onclick="tab(2)">Bouncy ball</button></div></section><section id="p1" class="pane active"><h2>Falling ball</h2><div class="grid"><div><label>Mass: <span id="ml">0.50</span> kg</label><input id="m" type="range" min="0.1" max="2" step="0.05" value="0.5" oninput="fall()"><label>Drop height: <span id="hl">5.0</span> m</label><input id="h" type="range" min="0.5" max="20" step="0.5" value="5" oninput="fall()"><label>Fraction transferred to internal energy: <span id="fl">0</span>%</label><input id="f" type="range" min="0" max="80" step="5" value="0" oninput="fall()"><div class="box" id="ft"></div></div><div><div class="bars"><div class="bw"><div class="val" id="uval"></div><div class="bar" id="ubar"></div><div>|ΔU<sub>g</sub>|</div></div><div class="bw"><div class="val" id="kval"></div><div class="bar" id="kbar"></div><div>K<sub>f</sub></div></div><div class="bw"><div class="val" id="ival"></div><div class="bar" id="ibar"></div><div>ΔU<sub>int</sub></div></div></div></div></div></section><section id="p2" class="pane"><h2>Bouncy ball</h2><div class="grid"><div><label>Mass: <span id="bml">0.10</span> kg</label><input id="bm" type="range" min="0.02" max="1" step="0.01" value="0.10" oninput="bounce()"><label>Drop height h₁: <span id="h1l">1.50</span> m</label><input id="h1" type="range" min="0.2" max="3" step="0.05" value="1.5" oninput="bounce()"><label>Rebound height h₂: <span id="h2l">0.90</span> m</label><input id="h2" type="range" min="0.05" max="2.8" step="0.05" value="0.9" oninput="bounce()"><div class="box" id="bt"></div></div><div><div class="formula">U<sub>g,i</sub> = mgh₁</div><div class="formula">U<sub>g,rebound</sub> = mgh₂</div><div class="formula">ΔE<sub>mech,not recovered</sub> ≈ mg(h₁ − h₂)</div></div></div></section></main><script>const g=9.8;function tab(n){for(let i=1;i<=2;i++){document.getElementById('p'+i).classList.toggle('active',i===n);document.getElementById('b'+i).classList.toggle('active',i===n)}}function fall(){let M=+m.value,H=+h.value,F=+f.value/100;ml.textContent=M.toFixed(2);hl.textContent=H.toFixed(1);fl.textContent=(100*F).toFixed(0);let E=M*g*H,U=F*E,K=(1-F)*E,V=Math.sqrt(2*K/M);ft.innerHTML=`<b>Equation:</b> |ΔU<sub>g</sub>| = mgh<br><b>Substitution:</b> (${M.toFixed(2)})(9.8)(${H.toFixed(1)}) = ${E.toFixed(2)} J<br><br><b>Equation:</b> |ΔU<sub>g</sub>| = K<sub>f</sub> + ΔU<sub>int</sub><br><b>Values:</b> K<sub>f</sub> = ${K.toFixed(2)} J, ΔU<sub>int</sub> = ${U.toFixed(2)} J<br><br><b>Equation:</b> K = ½mv²<br><b>Rearranged:</b> v = √(2K/m)<br><b>Answer:</b> v = <b>${V.toFixed(2)} m s⁻¹</b>`;uval.textContent=E.toFixed(1)+' J';kval.textContent=K.toFixed(1)+' J';ival.textContent=U.toFixed(1)+' J';ubar.style.height='150px';kbar.style.height=(150*(1-F))+'px';ibar.style.height=(150*F)+'px'}function bounce(){let M=+bm.value,H1=+h1.value,H2=+h2.value;if(H2>H1){H2=H1;h2.value=H1}bml.textContent=M.toFixed(2);h1l.textContent=H1.toFixed(2);h2l.textContent=H2.toFixed(2);let E1=M*g*H1,E2=M*g*H2,L=E1-E2,P=100*H2/H1;bt.innerHTML=`<b>Equation:</b> U<sub>g,i</sub> = mgh₁<br><b>Substitution:</b> (${M.toFixed(2)})(9.8)(${H1.toFixed(2)}) = ${E1.toFixed(3)} J<br><br><b>Equation:</b> U<sub>g,rebound</sub> = mgh₂<br><b>Substitution:</b> (${M.toFixed(2)})(9.8)(${H2.toFixed(2)}) = ${E2.toFixed(3)} J<br><br><b>Equation:</b> ΔE<sub>mech,not recovered</sub> ≈ mg(h₁−h₂)<br><b>Answer:</b> ${L.toFixed(3)} J; mechanically recovered = <b>${P.toFixed(1)}%</b>`}fall();bounce();</script></body></html>
